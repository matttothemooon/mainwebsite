<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>admin — mattothemoon</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-wrap { max-width: 560px; }
    .row { display: flex; gap: var(--gap-sm); align-items: center; margin-bottom: var(--gap-sm); }
    .row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); padding: 8px 10px; border-radius: 6px; }
    .row button, .btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent); font-family: var(--font-mono); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .row button:hover, .btn:hover { border-color: var(--accent); }
    .btn--danger { border-color: #6b2f2f; color: #e08787; }
    .btn--danger:hover { border-color: #e08787; }
    #signin { text-align: center; padding: var(--gap-lg) 0; }
    #status-msg { color: var(--text-dim); font-size: 0.85rem; margin-top: var(--gap-sm); min-height: 1em; }
  </style>
</head>
<body>
  <div class="terminal admin-wrap">
    <div class="terminal__bar"><span></span><span></span><span></span></div>
    <main class="terminal__content">
      <h1>admin</h1>
      <p class="bio">manage social links</p>

      <div id="signin">
        <a class="btn" href="/api/auth/login">sign in with github</a>
      </div>

      <div id="editor" style="display:none;">
        <div id="link-rows"></div>
        <button class="btn" id="add-row">+ add link</button>

        <p class="prompt prompt--section" style="margin-top: var(--gap-lg);">
          <a href="/api/auth/logout" style="color: var(--text-dim);">sign out</a>
        </p>

        <button class="btn" id="save" style="margin-top: var(--gap-sm);">save changes</button>
        <div id="status-msg"></div>
      </div>
    </main>
  </div>

  <script>
    const rowsEl = document.getElementById("link-rows");
    let links = [];

    function renderRows() {
      rowsEl.innerHTML = "";
      links.forEach((link, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <input value="${link.label}" placeholder="label" data-field="label" data-index="${i}" />
          <input value="${link.url}" placeholder="url" data-field="url" data-index="${i}" />
          <button data-action="up" data-index="${i}" title="move up">↑</button>
          <button data-action="down" data-index="${i}" title="move down">↓</button>
          <button class="btn--danger" data-action="remove" data-index="${i}">×</button>
        `;
        rowsEl.appendChild(row);
      });
    }

    rowsEl.addEventListener("input", (e) => {
      const { field, index } = e.target.dataset;
      if (!field) return;
      links[Number(index)][field] = e.target.value;
    });

    rowsEl.addEventListener("click", (e) => {
      const { action, index } = e.target.dataset;
      if (!action) return;
      const i = Number(index);

      if (action === "remove") links.splice(i, 1);
      if (action === "up" && i > 0) [links[i - 1], links[i]] = [links[i], links[i - 1]];
      if (action === "down" && i < links.length - 1) [links[i + 1], links[i]] = [links[i], links[i + 1]];

      renderRows();
    });

    document.getElementById("add-row").addEventListener("click", () => {
      links.push({ label: "", url: "" });
      renderRows();
    });

    document.getElementById("save").addEventListener("click", async () => {
      const statusEl = document.getElementById("status-msg");
      statusEl.textContent = "saving…";
      try {
        const res = await fetch("/api/admin/links", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(links),
        });
        if (!res.ok) throw new Error(await res.text());
        statusEl.textContent = "saved.";
      } catch (err) {
        statusEl.textContent = "save failed — check console.";
        console.error(err);
      }
    });

    async function init() {
      const res = await fetch("/api/admin/links");
      if (res.status === 401) {
        document.getElementById("signin").style.display = "block";
        document.getElementById("editor").style.display = "none";
        return;
      }
      links = await res.json();
      document.getElementById("signin").style.display = "none";
      document.getElementById("editor").style.display = "block";
      renderRows();
    }

    init();
  </script>
</body>
</html>
